[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "file-integrity-monitor"
dynamic = ["version"]
description = "Defensive file integrity monitor with an HMAC-protected baseline, for home labs and endpoints you own."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Otabek Yakubov" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
release = ["build", "pip-audit", "bandit"]

[project.scripts]
fim = "fim.cli.main:main"

[tool.hatch.version]
path = "src/fim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fim"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README.md", "LICENSE", "SECURITY.md", "PLAN.md", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
markers = [
    "slow: takes more than about a second; excluded from the default gate, included by --full and CI",
    "requires_symlinks: needs the OS to allow creating symlinks",
    "requires_git: needs the git executable and a git work tree",
    "posix_only: only meaningful on POSIX systems",
    "windows_only: only meaningful on Windows",
]

[tool.coverage.run]
source = ["fim"]
branch = true

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "T20", "N", "A", "ARG", "PIE", "TID"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, build throwaway data and run git/python subprocesses on purpose.
"tests/**" = ["S101", "S603", "S607", "S105", "S106", "ARG001", "ARG002"]
# The scripts are developer tooling: they print and run tools through subprocess.
"scripts/**" = ["T201", "S603"]
# The CLI is the one place that prints (architecture rule).
"src/fim/cli/**" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
files = ["src", "scripts", "tests"]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "scripts"
